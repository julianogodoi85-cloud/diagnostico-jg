<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico de Dados — JG Consultoria</title>
  <meta name="description" content="Descubra se seu negócio está tomando decisões no escuro. Diagnóstico gratuito em 3 minutos." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060d1f; font-family: Georgia, 'Times New Roman', serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade { animation: fadeIn 0.5s ease; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #00d4ff44; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const questions = [
      {
        id: 1,
        text: "Você sabe hoje, com precisão, qual produto ou serviço te dá mais margem de lucro?",
        options: [
          { label: "Sim, tenho isso claro e atualizado", value: 3 },
          { label: "Tenho uma ideia, mas não é preciso", value: 1 },
          { label: "Não sei ao certo", value: 0 },
        ],
      },
      {
        id: 2,
        text: "Quando o faturamento cai, você consegue identificar a causa em menos de 1 dia?",
        options: [
          { label: "Sim, tenho visibilidade rápida disso", value: 3 },
          { label: "Levo alguns dias pesquisando", value: 1 },
          { label: "Fico no achismo até entender", value: 0 },
        ],
      },
      {
        id: 3,
        text: "Você sabe quais clientes geram mais lucro (não apenas mais receita)?",
        options: [
          { label: "Sim, consigo distinguir claramente", value: 3 },
          { label: "Tenho uma percepção, mas sem dados", value: 1 },
          { label: "Não tenho essa visão", value: 0 },
        ],
      },
      {
        id: 4,
        text: "Como você toma decisões importantes no seu negócio?",
        options: [
          { label: "Com base em dados e relatórios confiáveis", value: 3 },
          { label: "Mistura de dados e intuição", value: 1 },
          { label: "Principalmente pela experiência e feeling", value: 0 },
        ],
      },
      {
        id: 5,
        text: "Suas planilhas ou relatórios estão sempre atualizados e acessíveis?",
        options: [
          { label: "Sim, tenho um processo organizado", value: 3 },
          { label: "Às vezes ficam desatualizados", value: 1 },
          { label: "São uma bagunça ou não existem", value: 0 },
        ],
      },
      {
        id: 6,
        text: "Você consegue projetar seu faturamento dos próximos 3 meses com confiança?",
        options: [
          { label: "Sim, tenho previsibilidade razoável", value: 3 },
          { label: "Faço uma estimativa, mas com muita incerteza", value: 1 },
          { label: "É muito difícil prever", value: 0 },
        ],
      },
      {
        id: 7,
        text: "Você sabe exatamente onde o dinheiro está 'vazando' no seu negócio?",
        options: [
          { label: "Sim, tenho os custos mapeados", value: 3 },
          { label: "Suspeito de alguns pontos, mas sem certeza", value: 1 },
          { label: "Não tenho clareza sobre isso", value: 0 },
        ],
      },
      {
        id: 8,
        text: "Quanto tempo você gasta por semana tentando entender os números do negócio?",
        options: [
          { label: "Pouco — tenho relatórios que facilitam", value: 3 },
          { label: "Algumas horas juntando informações", value: 1 },
          { label: "Muito tempo, e ainda fico com dúvidas", value: 0 },
        ],
      },
      {
        id: 9,
        text: "Você já tomou uma decisão errada por falta de informação clara?",
        options: [
          { label: "Raramente, tenho boa visibilidade", value: 3 },
          { label: "Algumas vezes isso aconteceu", value: 1 },
          { label: "Sim, isso me custou dinheiro", value: 0 },
        ],
      },
      {
        id: 10,
        text: "Se um sócio ou investidor pedisse os números do negócio agora, você estaria pronto?",
        options: [
          { label: "Sim, consigo apresentar em poucas horas", value: 3 },
          { label: "Precisaria de alguns dias para organizar", value: 1 },
          { label: "Seria um problema sério", value: 0 },
        ],
      },
    ];

    function getResult(score) {
      const pct = Math.round((score / 30) * 100);
      if (pct >= 80) return {
        level: 4, title: "Negócio Orientado a Dados", color: "#00e5a0", emoji: "🟢",
        description: "Você já tem uma boa base de gestão por dados. Pequenos ajustes podem transformar sua operação em referência no setor.",
        loss: "Baixo — mas há oportunidades de otimização ainda não exploradas.",
        cta: "Mesmo negócios maduros têm pontos cegos. Uma sessão de diagnóstico pode revelar onde você pode crescer mais.",
      };
      if (pct >= 55) return {
        level: 3, title: "Gestão em Transição", color: "#00d4ff", emoji: "🔵",
        description: "Você tem consciência da importância dos dados, mas ainda toma decisões no escuro em momentos críticos.",
        loss: "Estimativa: 10% a 20% de receita desperdiçada por decisões sem informação precisa.",
        cta: "Com clareza nos números certos, você pode aumentar sua margem sem precisar vender mais.",
      };
      if (pct >= 30) return {
        level: 2, title: "Gestão no Feeling", color: "#f59e0b", emoji: "🟡",
        description: "Seu negócio funciona mais pela sua experiência do que por dados. Isso funciona até certo ponto — depois trava o crescimento.",
        loss: "Estimativa: 20% a 35% de resultado perdido por falta de visibilidade.",
        cta: "Você provavelmente já sentiu que algo não fecha nos números — mas não sabe onde. É exatamente isso que eu resolvo.",
      };
      return {
        level: 1, title: "Negócio no Escuro", color: "#e91e8c", emoji: "🔴",
        description: "Você está pilotando sem instrumentos. As decisões são baseadas em percepção, e isso custa dinheiro todo mês.",
        loss: "Estimativa: 30% a 50% de potencial desperdiçado todo mês.",
        cta: "Isso não é crítica — é realidade de 80% das PMEs. A boa notícia: é completamente reversível com o processo certo.",
      };
    }

    const S = {
      page: {
        minHeight: "100vh",
        background: "linear-gradient(160deg, #0d1b3e 0%, #060d1f 60%)",
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: "24px 16px",
      },
      wrap: { width: "100%", maxWidth: 620, position: "relative" },
      badge: {
        display: "inline-block",
        border: "1px solid rgba(0,212,255,0.35)",
        borderRadius: 4, padding: "4px 16px",
        color: "#00d4ff", fontSize: 11, letterSpacing: 3,
        textTransform: "uppercase", marginBottom: 28,
        background: "rgba(0,212,255,0.06)",
        fontFamily: "sans-serif",
      },
      h1: {
        color: "#e8f4ff", fontSize: "clamp(26px,5vw,42px)",
        fontWeight: 400, lineHeight: 1.2, margin: "0 0 18px", letterSpacing: "-0.5px",
      },
      sub: {
        color: "#7a90b0", fontSize: 16, lineHeight: 1.7,
        margin: "0 auto 36px", maxWidth: 480,
        fontFamily: "'Helvetica Neue',Arial,sans-serif", fontWeight: 300,
      },
      btn: (active) => ({
        background: active ? "#00d4ff" : "rgba(0,212,255,0.07)",
        color: active ? "#060d1f" : "#7a90b0",
        border: "none", padding: "15px 36px",
        fontSize: 14, fontWeight: 700, letterSpacing: 1,
        textTransform: "uppercase", cursor: active ? "pointer" : "not-allowed",
        borderRadius: 3, fontFamily: "sans-serif", width: "100%",
        transition: "all 0.2s",
      }),
      optBtn: (sel) => ({
        background: sel ? "rgba(0,212,255,0.1)" : "rgba(255,255,255,0.03)",
        border: sel ? "1px solid rgba(0,212,255,0.55)" : "1px solid rgba(255,255,255,0.07)",
        borderRadius: 4, padding: "15px 18px",
        color: sel ? "#e8f4ff" : "#7a90b0",
        fontSize: 14, textAlign: "left", cursor: "pointer",
        transition: "all 0.2s",
        fontFamily: "'Helvetica Neue',Arial,sans-serif", fontWeight: 300, lineHeight: 1.4,
        display: "flex", alignItems: "center", gap: 12,
      }),
      radio: (sel) => ({
        width: 18, height: 18, borderRadius: "50%", flexShrink: 0,
        border: sel ? "2px solid #00d4ff" : "2px solid rgba(255,255,255,0.2)",
        background: sel ? "#00d4ff" : "transparent",
        transition: "all 0.2s",
      }),
      card: (borderColor) => ({
        background: "rgba(13,27,62,0.8)",
        border: `1px solid ${borderColor || "rgba(255,255,255,0.08)"}`,
        borderRadius: 5, padding: "18px 22px", marginBottom: 14,
      }),
      progBar: (pct) => ({
        height: 2, background: "#1a3060", borderRadius: 1, marginBottom: 36,
        position: "relative",
      }),
      progFill: (pct) => ({
        position: "absolute", top: 0, left: 0, height: "100%",
        width: `${pct}%`, background: "#00d4ff", borderRadius: 1,
        transition: "width 0.4s ease",
      }),
    };

    function App() {
      const [step, setStep] = useState("intro"); // intro | quiz | result
      const [current, setCurrent] = useState(0);
      const [answers, setAnswers] = useState({});
      const [selected, setSelected] = useState(null);

      const score = Object.values(answers).reduce((a, b) => a + b, 0);
      const result = getResult(score);
      const progress = (current / questions.length) * 100;

      function handleNext() {
        if (selected === null) return;
        const newAns = { ...answers, [current]: selected };
        setAnswers(newAns);
        setSelected(null);
        if (current + 1 >= questions.length) setStep("result");
        else setCurrent(current + 1);
      }

      function restart() {
        setStep("intro"); setCurrent(0); setAnswers({}); setSelected(null);
      }

      const waMsg = encodeURIComponent(`Olá, fiz o diagnóstico e meu resultado foi "${result.title}". Quero entender melhor os números do meu negócio.`);
      const waUrl = `https://wa.me/5511998927702?text=${waMsg}`;

      return (
        <div style={S.page}>
          <div style={S.wrap}>

            {/* ── INTRO ── */}
            {step === "intro" && (
              <div className="fade" style={{ textAlign: "center" }}>
                <div style={S.badge}>Diagnóstico Gratuito</div>
                <h1 style={S.h1}>
                  Seu negócio está<br />
                  <em style={{ color: "#00d4ff", fontStyle: "italic" }}>tomando decisões no escuro?</em>
                </h1>
                <p style={S.sub}>
                  10 perguntas. 3 minutos. Descubra onde os números do seu negócio
                  estão te custando dinheiro — e o que fazer com isso.
                </p>
                <button
                  style={S.btn(true)}
                  onClick={() => setStep("quiz")}
                  onMouseOver={e => e.currentTarget.style.background = "#33ddff"}
                  onMouseOut={e => e.currentTarget.style.background = "#00d4ff"}
                >
                  Iniciar Diagnóstico →
                </button>
                <p style={{ color: "#3a5070", fontSize: 12, marginTop: 16, fontFamily: "sans-serif" }}>
                  Sem cadastro. Sem spam. Resultado imediato.
                </p>
                <p style={{ color: "#3a5070", fontSize: 11, marginTop: 8, fontFamily: "sans-serif" }}>
                  JG Consultoria em Inteligência de Negócio
                </p>
              </div>
            )}

            {/* ── QUIZ ── */}
            {step === "quiz" && (
              <div className="fade">
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ color: "#4a6080", fontSize: 11, fontFamily: "sans-serif", letterSpacing: 1 }}>
                    PERGUNTA {current + 1} DE {questions.length}
                  </span>
                  <span style={{ color: "#00d4ff", fontSize: 11, fontFamily: "sans-serif" }}>
                    {Math.round(progress)}%
                  </span>
                </div>
                <div style={S.progBar(progress)}>
                  <div style={S.progFill(progress)} />
                </div>

                <h2 style={{ color: "#e8f4ff", fontSize: "clamp(17px,3vw,22px)", fontWeight: 400, lineHeight: 1.45, marginBottom: 28, letterSpacing: "-0.2px" }}>
                  {questions[current].text}
                </h2>

                <div style={{ display: "flex", flexDirection: "column", gap: 11, marginBottom: 28 }}>
                  {questions[current].options.map((opt, i) => (
                    <button
                      key={i}
                      style={S.optBtn(selected === opt.value)}
                      onClick={() => setSelected(opt.value)}
                      onMouseOver={e => { if (selected !== opt.value) e.currentTarget.style.borderColor = "rgba(0,212,255,0.3)"; }}
                      onMouseOut={e => { if (selected !== opt.value) e.currentTarget.style.borderColor = "rgba(255,255,255,0.07)"; }}
                    >
                      <span style={S.radio(selected === opt.value)} />
                      {opt.label}
                    </button>
                  ))}
                </div>

                <button
                  onClick={handleNext}
                  disabled={selected === null}
                  style={S.btn(selected !== null)}
                  onMouseOver={e => { if (selected !== null) e.currentTarget.style.background = "#33ddff"; }}
                  onMouseOut={e => { if (selected !== null) e.currentTarget.style.background = "#00d4ff"; }}
                >
                  {current + 1 === questions.length ? "Ver Resultado →" : "Próxima →"}
                </button>
              </div>
            )}

            {/* ── RESULT ── */}
            {step === "result" && (
              <div className="fade">
                <div style={{ textAlign: "center", marginBottom: 32 }}>
                  <div style={S.badge}>Seu Resultado</div>

                  {/* Score ring */}
                  <div style={{ position: "relative", display: "inline-block", marginBottom: 20 }}>
                    <svg width={130} height={130} viewBox="0 0 130 130">
                      <circle cx={65} cy={65} r={55} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={8} />
                      <circle cx={65} cy={65} r={55} fill="none"
                        stroke={result.color} strokeWidth={8}
                        strokeDasharray={`${2 * Math.PI * 55}`}
                        strokeDashoffset={`${2 * Math.PI * 55 * (1 - score / 30)}`}
                        strokeLinecap="round"
                        transform="rotate(-90 65 65)"
                        style={{ transition: "stroke-dashoffset 1.2s ease" }}
                      />
                    </svg>
                    <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                      <span style={{ color: "#e8f4ff", fontSize: 30, fontWeight: 300 }}>{score}</span>
                      <span style={{ color: "#4a6080", fontSize: 10, fontFamily: "sans-serif", letterSpacing: 1 }}>DE 30</span>
                    </div>
                  </div>

                  <div style={{ display: "inline-block", background: `${result.color}18`, border: `1px solid ${result.color}40`, borderRadius: 4, padding: "5px 18px", marginBottom: 14 }}>
                    <span style={{ color: result.color, fontSize: 13, fontFamily: "sans-serif", fontWeight: 600 }}>
                      {result.emoji} Nível {result.level} — {result.title}
                    </span>
                  </div>

                  <p style={{ color: "#c8d6e5", fontSize: 15, lineHeight: 1.7, margin: "0 auto", maxWidth: 490, fontFamily: "'Helvetica Neue',Arial,sans-serif", fontWeight: 300 }}>
                    {result.description}
                  </p>
                </div>

                {/* Impact box */}
                <div style={{ ...S.card("rgba(233,30,140,0.25)"), borderLeft: "3px solid #e91e8c", marginBottom: 12 }}>
                  <p style={{ color: "#4a6080", fontSize: 10, fontFamily: "sans-serif", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 6px" }}>Impacto Estimado</p>
                  <p style={{ color: "#ffadd6", fontSize: 14, margin: 0, fontFamily: "sans-serif", fontWeight: 300 }}>{result.loss}</p>
                </div>

                {/* CTA insight */}
                <div style={{ ...S.card("rgba(0,212,255,0.2)"), borderLeft: "3px solid #00d4ff", marginBottom: 24 }}>
                  <p style={{ color: "#c8d6e5", fontSize: 14, margin: 0, fontFamily: "sans-serif", fontWeight: 300, lineHeight: 1.6 }}>{result.cta}</p>
                </div>

                {/* WhatsApp */}
                <a href={waUrl} target="_blank" rel="noopener noreferrer"
                  style={{ display: "block", background: "#00d4ff", color: "#060d1f", textDecoration: "none", padding: "15px 32px", fontSize: 14, fontWeight: 700, letterSpacing: 0.5, textAlign: "center", borderRadius: 3, marginBottom: 10, fontFamily: "sans-serif" }}
                  onMouseOver={e => e.currentTarget.style.background = "#33ddff"}
                  onMouseOut={e => e.currentTarget.style.background = "#00d4ff"}
                >
                  💬 Quero entender os números do meu negócio
                </a>

                <button onClick={restart}
                  style={{ display: "block", width: "100%", background: "transparent", color: "#3a5070", border: "1px solid rgba(255,255,255,0.05)", padding: "11px", fontSize: 12, cursor: "pointer", borderRadius: 3, fontFamily: "sans-serif" }}
                  onMouseOver={e => e.target.style.color = "#7a90b0"}
                  onMouseOut={e => e.target.style.color = "#3a5070"}
                >
                  Refazer o diagnóstico
                </button>

                <p style={{ textAlign: "center", color: "#3a5070", fontSize: 10, marginTop: 20, fontFamily: "sans-serif" }}>
                  JG Consultoria em Inteligência de Negócio • Juliano Godoi
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
